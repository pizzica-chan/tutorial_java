<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>申請一覧 | 申請くん</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-logo" href="#">申請くん</a>
      <nav class="app-nav">
        <a href="#">申請一覧</a>
        <a href="#">申請履歴</a>
        <a href="#">新規申請</a>
      </nav>
      <div class="app-user">
        <span class="app-user-name">山田太郎</span>
      </div>
    </div>
  </header>
  <main class="app-main">
    <div class="page-head">
      <h1>申請一覧</h1>
      <a class="btn" href="#">新規申請</a>
    </div>
    <p class="lead">未承認の申請です。承認と新規申請は、この画面から行います。</p>
    <table class="data">
      <thead>
        <tr>
          <th>ID</th>
          <th>件名</th>
          <th>申請者</th>
          <th>承認者</th>
          <th>ステータス</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6">表示できる申請はありません。</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
