<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="fragments/layout :: layout(title=${requestItem.title}, content=~{::main})">
<main>
  <p class="back"><a th:href="@{/requests}">← 申請一覧</a></p>
  <p th:if="${errorMessage}" class="flash error" th:text="${errorMessage}">この申請は承認できません</p>
  <h1 th:text="${requestItem.title}">交通費申請</h1>
  <dl class="detail">
    <dt>申請ID</dt>
    <dd th:text="${requestItem.id}">12</dd>
    <dt>ステータス</dt>
    <dd>
      <span class="status" th:classappend="${requestItem.status == 'PENDING'} ? ' is-pending' : ' is-approved'" th:text="${requestItem.status}">PENDING</span>
    </dd>
    <dt>申請者</dt>
    <dd th:text="${requestItem.applicantName}">山田太郎</dd>
    <dt>承認者</dt>
    <dd th:text="${requestItem.approverName != null ? requestItem.approverName : '未設定'}">佐藤花子</dd>
    <dt>申請日時</dt>
    <dd th:text="${#temporals.format(requestItem.createdAt, 'yyyy-MM-dd HH:mm')}">2026-04-10 09:15</dd>
  </dl>
  <form class="js-approve-confirm"
        th:action="@{/requests/{id}/approve(id=${requestItem.id})}"
        method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="btn-approve">承認</button>
  </form>
</main>
</html>
